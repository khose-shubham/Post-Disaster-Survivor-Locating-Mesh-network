; PlatformIO Project Configuration for TRACE Firmware Suite
; Target: ESP32-WROOM-32D / ESP32-S3

[platformio]
default_envs = gateway

[env]
platform = espressif32 @ ^6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.1.0
    h2zero/NimBLE-Arduino @ ^1.4.2

[env:gateway]
board = esp32dev
src_filter = +<../firmware/trace_gateway/*>

[env:sniffer]
board = esp32dev
src_filter = +<../firmware/trace_sniffer/*>

[env:beacon]
board = esp32dev
src_filter = +<../firmware/trace_beacon/*>
