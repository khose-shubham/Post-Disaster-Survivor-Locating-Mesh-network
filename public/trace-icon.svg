<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer calibration ring -->
  <circle cx="32" cy="32" r="30" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="23" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="32" cy="32" r="14" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Crosshairs -->
  <line x1="32" y1="2" x2="32" y2="62" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 4"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 4"/>

  <!-- Radar sweep wedge -->
  <path d="M32 32 L54 18 A25 25 0 0 0 32 7 Z" fill="#00f2fe" fill-opacity="0.18"/>

  <!-- Triangulated node markers -->
  <polygon points="32,16 46,42 18,42" stroke="#38ef7d" stroke-width="1.5" stroke-opacity="0.8" fill="#38ef7d" fill-opacity="0.08"/>

  <!-- Center emitter / beacon -->
  <circle cx="32" cy="32" r="3.5" fill="#00f2fe"/>
  <circle cx="32" cy="32" r="7" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.8"/>
  <circle cx="32" cy="16" r="2" fill="#38ef7d"/>
  <circle cx="46" cy="42" r="2" fill="#38ef7d"/>
  <circle cx="18" cy="42" r="2" fill="#38ef7d"/>
</svg>
